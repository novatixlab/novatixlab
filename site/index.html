<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노바틱스랩</title>
<meta name="description" content="노바틱스랩 홈페이지 — 배포 준비 중">
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5d6470;
    --line: #e3e6ea;
    --accent: #2b5cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --fg: #f2f4f7;
      --muted: #9aa2af;
      --line: #23272e;
      --accent: #7f9dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 24px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
             color: var(--muted); margin: 0 0 12px; }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 8px; }
  code { background: var(--line); border-radius: 4px; padding: 1px 5px;
         font-size: 0.9em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--accent); margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>노바틱스랩</h1>
  <p>컨테이너가 정상적으로 구동 중입니다. 이 화면은 실제 홈페이지로 교체될 임시 페이지입니다.</p>
  <div class="card">
    <h2>다음 단계</h2>
    <ol>
      <li>Claude 디자인에서 내보낸 웹페이지 파일을 <code>site/</code> 폴더에 넣습니다.</li>
      <li>이 <code>site/index.html</code> 파일을 실제 홈페이지의 <code>index.html</code>로 덮어씁니다.</li>
      <li>시놀로지 Container Manager에서 프로젝트를 <strong>빌드 후 재시작</strong>합니다.</li>
    </ol>
  </div>
</main>
</body>
</html>
